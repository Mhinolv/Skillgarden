name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
jobs:
  ci-gate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./scripts/build.sh
      - name: Test
        run: ./scripts/build.sh test
      - name: UI snapshots
        run: ./scripts/snapshot.sh "$RUNNER_TEMP/snapshots"
      - name: Upload UI snapshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: ${{ runner.temp }}/snapshots
