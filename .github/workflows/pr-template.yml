name: PR template
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check required sections
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          fail=0
          for s in "## Issue" "## What changed" "## How it was tested" "## Screenshots"; do
            printf '%s' "$BODY" | grep -qF "$s" || { echo "Missing section: $s"; fail=1; }
          done
          printf '%s' "$BODY" | grep -qE '(Closes|Refs) #[0-9]+' || { echo "Missing 'Closes #n' or 'Refs #n'"; fail=1; }
          exit $fail
